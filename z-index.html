<!doctype html>
<html>
    <head>
        <title>z-index</title>
        <style>
            img{
                position:absolute;
                left:0px;
                top:0px;
                z-index:-1;
            }
        </style>
    </head>
    <body>
        <h3>heading</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMYABlzKxG_1mMfYwg3MCS8QGGCFlspF1iIw&s">
    </body>
</html>
