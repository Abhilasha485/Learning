<!doctype html>
<html>
    <head>
        <title>dropdown</title>
        <style>
            .dropdown {
                position:relative;
                display:inline-block;
            }
            .dropdown-content {
                display:none;
                position:absolute;
                background-color:beige;
                padding:25px;
                z-index:-1;
                box-shadow:16px;
            }
        </style>
    </head>
    <body>
        <div class="dropdown">
            <span>details</span>
            <div class="dropdown-content">
                <p>name</p>
                <p>branch</p>
            </div>
        </div>
    </body>
    </html>
